# Render blueprint. Committed rather than configured in the dashboard so the
# deploy is reproducible and reviewable — a service configured by clicking is
# a service nobody else can rebuild.
services:
  - type: web
    name: supplier-quality-agent
    runtime: python
    region: singapore          # matches Neon, or every query crosses a region
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false            # set in the dashboard, never in the repo
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.14"